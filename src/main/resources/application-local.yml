spring:
  datasource:
    url: jdbc:h2:mem:meridian_payments;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

server:
  port: ${PORT:8085}

recovery:
  max-retries: 3
  scanner:
    enabled: true
    fixed-delay-ms: 60000
    initial-delay-ms: 15000

logging:
  level:
    root: INFO
    com.meridian.payments: DEBUG
