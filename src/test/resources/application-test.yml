spring:
  datasource:
    url: jdbc:h2:mem:meridian_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  sql:
    init:
      mode: never

recovery:
  max-retries: 3
  scanner:
    enabled: false
    fixed-delay-ms: 60000
    initial-delay-ms: 10000

logging:
  level:
    root: INFO
    com.meridian.payments: DEBUG
